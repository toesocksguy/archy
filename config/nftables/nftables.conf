#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# Base firewall for Arch Linux workstation.
# Policy: default DROP inbound, unrestricted outbound.
#
# This is a minimal base config deployed by setup.sh.
# Add machine-specific rules (app ports, LAN subnet, etc.) below the
# SSH rule — see the inline comments for guidance.
#
# To apply changes:  systemctl restart nftables
# To view rules:     nft list ruleset

# Tear down any existing ruleset cleanly before loading ours.
destroy table inet filter

# inet = applies to both IPv4 and IPv6 traffic.
table inet filter {

  chain input {
    type filter hook input priority filter
    # Default policy: DROP everything not explicitly allowed below.
    policy drop

    # Drop packets in an invalid conntrack state (e.g. out-of-sequence TCP).
    ct state invalid drop comment "drop invalid connections"

    # Allow return traffic for connections we initiated, and related traffic
    # (e.g. ICMP errors). This is what makes unrestricted outbound work
    # without an explicit output chain.
    ct state { established, related } accept comment "allow tracked connections"

    # Always allow loopback (127.0.0.1, ::1). Many local services depend on it.
    iif lo accept comment "allow loopback"

    # Allow traffic from libvirt VMs to the host over the virbr0 bridge.
    # VMs use the host as their gateway — this permits DNS, NFS, etc.
    iif virbr0 accept comment "allow libvirt internal traffic"

    # Allow ICMP (ping, traceroute, path MTU discovery) for IPv4 and IPv6.
    meta l4proto { icmp, ipv6-icmp } accept comment "allow icmp"

    # SSH: restrict to your LAN subnet to avoid internet exposure.
    # Replace 192.168.0.0/16 with your actual subnet (e.g. 192.168.86.0/24).
    ip saddr 192.168.0.0/16 tcp dport 22 accept comment "ssh - LAN only"

    # --- Add machine-specific rules here ---
    # Examples:
    #   ip saddr 192.168.86.0/24 tcp dport 8096 accept comment "jellyfin - LAN only"
    #   tcp dport 51820 accept comment "wireguard"

    # Final counter — tracks packets that hit the DROP policy.
    # Useful for debugging: check with `nft list ruleset`.
    counter
  }

  chain forward {
    type filter hook forward priority filter
    # Drop all forwarded traffic — this is a workstation, not a router.
    policy drop

    # Allow libvirt VMs to route through the host (e.g. internet access).
    iif virbr0 accept
    oif virbr0 accept
  }

  # No output chain = outbound traffic is unrestricted.
}
